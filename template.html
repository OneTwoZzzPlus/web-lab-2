<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Задачник+</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    </head>
    <body>
        <header>
            <h1>Задачник+</h1>
            <div class="search">
                <label for="search"> Поиск задач </label>
                <input
                    type="text"
                    id="search"
                    name="search"
                    placeholder="Поиск задач..."
                />
                <button
                    type="button"
                    data-action="clear-search"
                    aria-label="Очистить поиск"
                >
                    <span>×</span>
                </button>
            </div>
            <div class="radios">
                <div class="radio">
                    <input
                        type="radio"
                        name="status"
                        id="all"
                        value="all"
                        checked
                    />
                    <label for="all">Все</label>
                    <input
                        type="radio"
                        name="status"
                        id="active"
                        value="active"
                    />
                    <label for="active">Активные</label>
                    <input
                        type="radio"
                        name="status"
                        id="completed"
                        value="completed"
                    />
                    <label for="completed">Выполненные</label>
                </div>
                <div class="radio">
                    <input
                        type="radio"
                        name="sort"
                        id="custom"
                        value="custom"
                        checked
                    />
                    <label for="custom">Вручную</label>
                    <input type="radio" name="sort" id="new" value="new" />
                    <label for="new">Ранние</label>
                    <input type="radio" name="sort" id="old" value="old" />
                    <label for="old">Поздние</label>
                </div>
            </div>
        </header>
        <main>
            <button class="task-add">+ добавить задачу</button>
            <ul class="tasks" draggable="false">
                <li class="task" draggable="false" data-task-id="1">
                    <form>
                        <input
                            type="text"
                            name="title"
                            placeholder="Название задачи..."
                            required
                        />
                        <input type="date" name="date" />
                        <div>
                            <button type="submit">Сохранить</button>
                            <button type="reset">Отмена</button>
                        </div>
                    </form>
                </li>
                <li class="task" draggable="true" data-task-id="1">
                    <p>Название задачи А</p>
                    <p>05-10-2026</p>
                    <div class="iconic-wrapper">
                        <button
                            class="iconic"
                            type="button"
                            data-action="toggle"
                        >
                            <img
                                alt="отметить выполненным"
                                src="assets/active.svg"
                            />
                        </button>
                        <button class="iconic" type="button" data-action="up">
                            <img alt="вверх" src="assets/up.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="down">
                            <img alt="вниз" src="assets/down.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="edit">
                            <img alt="редактировать" src="assets/edit.svg" />
                        </button>
                        <button
                            class="iconic"
                            type="button"
                            data-action="delete"
                        >
                            <img alt="удалить" src="assets/remove.svg" />
                        </button>
                    </div>
                </li>
                <li class="task checked" draggable="true" data-task-id="2">
                    <p>Название задачи Б</p>
                    <p>06-10-2026</p>
                    <div class="iconic-wrapper">
                        <button
                            class="iconic"
                            type="button"
                            data-action="toggle"
                        >
                            <img
                                alt="отметить активным"
                                src="assets/completed.svg"
                            />
                        </button>
                        <button class="iconic" type="button" data-action="up">
                            <img alt="вверх" src="assets/up.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="down">
                            <img alt="вниз" src="assets/down.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="edit">
                            <img alt="редактировать" src="assets/edit.svg" />
                        </button>
                        <button
                            class="iconic"
                            type="button"
                            data-action="delete"
                        >
                            <img alt="удалить" src="assets/remove.svg" />
                        </button>
                    </div>
                </li>
                <li class="task virtual" draggable="true" data-task-id="3">
                    <p>Название задачи В</p>
                    <p>07-10-2026</p>
                    <div class="iconic-wrapper">
                        <button
                            class="iconic"
                            type="button"
                            data-action="toggle"
                        >
                            <img
                                alt="отметить выполненным"
                                src="assets/active.svg"
                            />
                        </button>
                        <button class="iconic" type="button" data-action="up">
                            <img alt="вверх" src="assets/up.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="down">
                            <img alt="вниз" src="assets/down.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="edit">
                            <img alt="редактировать" src="assets/edit.svg" />
                        </button>
                        <button
                            class="iconic"
                            type="button"
                            data-action="delete"
                        >
                            <img alt="удалить" src="assets/remove.svg" />
                        </button>
                    </div>
                </li>
                <li class="task" draggable="true" data-task-id="4">
                    <p>Название задачи Г</p>
                    <p>08-10-2026</p>
                    <div class="iconic-wrapper">
                        <button
                            class="iconic"
                            type="button"
                            data-action="toggle"
                        >
                            <img
                                alt="отметить выполненным"
                                src="assets/active.svg"
                            />
                        </button>
                        <button class="iconic" type="button" data-action="up">
                            <img alt="вверх" src="assets/up.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="down">
                            <img alt="вниз" src="assets/down.svg" />
                        </button>
                        <button class="iconic" type="button" data-action="edit">
                            <img alt="редактировать" src="assets/edit.svg" />
                        </button>
                        <button
                            class="iconic"
                            type="button"
                            data-action="delete"
                        >
                            <img alt="удалить" src="assets/remove.svg" />
                        </button>
                    </div>
                </li>
            </ul>
        </main>
    </body>
</html>
